appId: com.daig.marketplace
name: "Login Email + Senha (PT-BR)"
tags:
  - auth
  - email
  - smoke

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*(ログイン|Entrar).*"
    timeout: 15000

- tapOn: ".*(ログイン|Entrar).*"

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: screenshots/login-email-start

- tapOn:
    text: "seu@email.com"
    optional: true

- inputText: "teste@daig.jp"

- hideKeyboard

- tapOn:
    text: "••••••••"
    optional: true

- inputText: "Senha@12345"

- hideKeyboard

- takeScreenshot: screenshots/login-email-filled

- tapOn: ".*(ログイン|Entrar).*"

- waitForAnimationToEnd:
    timeout: 8000

- takeScreenshot: screenshots/login-email-result
