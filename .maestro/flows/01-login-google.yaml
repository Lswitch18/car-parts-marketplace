appId: com.daig.marketplace
name: "Login com Google (OAuth)"
tags:
  - auth
  - google
  - smoke

---
- launchApp:
    clearState: true

- assertVisible: "Entrar"

- assertVisible: "Google"

- assertVisible: "Apple"

- takeScreenshot: screenshots/login-screen

- tapOn: "Google"

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: screenshots/google-oauth-redirect
