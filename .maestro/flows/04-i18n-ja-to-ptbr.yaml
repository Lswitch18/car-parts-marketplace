appId: com.daig.marketplace
name: "Language Switch JA -> PT-BR (LanguageDetector)"
tags:
  - i18n
  - ptbr
  - ja

---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*(ログイン|Entrar|Google).*"
    timeout: 15000

- takeScreenshot: screenshots/language-ja-default

- tapOn:
    text: ".*(ja|pt|Alterar idioma).*"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: ".*(Entrar|ログイン).*"

- assertVisible: ".*Google.*"

- assertVisible: ".*Apple.*"

- takeScreenshot: screenshots/language-ptbr-active
