appId: jp.daig.marketplace
name: "Login com Apple (Sign in with Apple)"
tags:
  - auth
  - apple
  - smoke

---
- launchApp:
    clearState: true

- assertVisible: "Entrar"

- assertVisible: "Apple"

- takeScreenshot: screenshots/login-screen-apple

- tapOn: "Apple"

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: screenshots/apple-signin-redirect
