services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-dind
    ports:
      - "8081:8080"
      - "50001:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_TLS_CERTDIR=
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    privileged: true

volumes:
  jenkins_home: