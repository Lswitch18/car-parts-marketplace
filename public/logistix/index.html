<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistix — WMS Dashboard</title>
  <meta name="description" content="Sistema de gerenciamento logístico profissional — Logistix WMS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="/logistix/css/styles.css">
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i data-lucide="package"></i></div>
      <div>
        <div class="logo-name">LOGISTIX</div>
        <div class="logo-sub">Smart Logistics</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </a>
      <a class="nav-item" data-page="pedidos" id="nav-pedidos">
        <i data-lucide="package"></i><span>Pedidos</span>
      </a>
      <a class="nav-item" data-page="coletas" id="nav-coletas">
        <i data-lucide="truck"></i><span>Coletas</span>
      </a>
      <a class="nav-item" data-page="transferencias" id="nav-transferencias">
        <i data-lucide="arrow-left-right"></i><span>Transferências</span>
      </a>
      <a class="nav-item" data-page="estoque" id="nav-estoque">
        <i data-lucide="boxes"></i><span>Estoque</span>
      </a>
      <a class="nav-item" data-page="armazens" id="nav-armazens">
        <i data-lucide="warehouse"></i><span>Armazéns</span>
      </a>
      <a class="nav-item" data-page="transportes" id="nav-transportes">
        <i data-lucide="truck"></i><span>Transportes</span>
      </a>
      <a class="nav-item" data-page="entregas" id="nav-entregas">
        <i data-lucide="map-pin"></i><span>Entregas</span>
      </a>
      <a class="nav-item" data-page="ocorrencias" id="nav-ocorrencias">
        <i data-lucide="alert-circle"></i><span>Ocorrências</span>
      </a>
      <a class="nav-item" data-page="clientes" id="nav-clientes">
        <i data-lucide="users"></i><span>Clientes</span>
      </a>
      <a class="nav-item" data-page="relatorios" id="nav-relatorios">
        <i data-lucide="bar-chart-2"></i><span>Relatórios</span>
      </a>
      <a class="nav-item" data-page="configuracoes" id="nav-configuracoes">
        <i data-lucide="settings"></i><span>Configurações</span>
      </a>
      <a class="nav-item" data-page="usuarios" id="nav-usuarios">
        <i data-lucide="users"></i><span>Usuários</span>
      </a>
      <a class="nav-item" data-page="auditoria" id="nav-auditoria">
        <i data-lucide="file-text"></i><span>Auditoria</span>
      </a>
    </nav>
    <div class="sidebar-user" onclick="logout()">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${Date.now()}&backgroundColor=3B82F6" alt="avatar" class="user-avatar">
      <div class="user-info">
        <div class="user-name" id="display-user-name">Usuário</div>
        <div class="user-role" id="display-user-role"> Carregando...</div>
      </div>
      <i data-lucide="log-out" class="user-chevron"></i>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="page-title">Dashboard</h2>
        <p id="page-subtitle">Bem-vindo de volta, Lucas 👋</p>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <i data-lucide="search"></i>
          <input type="text" id="global-search" placeholder="Buscar (Ctrl + K)" autocomplete="off">
        </div>
        <button class="icon-btn notif-btn" id="notif-btn">
          <i data-lucide="bell"></i>
          <span class="badge">12</span>
        </button>
        <button class="icon-btn" id="theme-btn">
          <i data-lucide="moon"></i>
        </button>
        <button class="btn-primary" id="quick-actions-btn">
          Ações rápidas <i data-lucide="chevron-down"></i>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content" id="page-content">
      <!-- Injected by JS -->
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="icon-btn" id="modal-close"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/pedidos.js"></script>
<script src="/js/pages/clientes.js"></script>
<script src="/js/pages/armazens.js"></script>
<script src="/js/pages/transportes.js"></script>
<script src="/js/pages/entregas.js"></script>
<script src="/js/pages/estoque.js"></script>
<script src="/js/pages/coletas.js"></script>
<script src="/js/pages/transferencias.js"></script>
<script src="/js/pages/ocorrencias.js"></script>
<script src="/js/pages/relatorios.js"></script>
<script src="/js/pages/configuracoes.js"></script>
<script src="/js/pages/usuarios.js"></script>
<script src="/js/pages/setores.js"></script>
<script src="/js/pages/auditoria.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
