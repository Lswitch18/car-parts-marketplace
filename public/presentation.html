<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DAIG — 公式プレゼンテーション & AIデモンストレーション (JA / PT)</title>
  
  <!-- Google Fonts: Outfit, Noto Sans JP & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════════════════
       DAIG DESIGN SYSTEM — MOBILE-FIRST CYBER NEON & JAPANESE AESTHETICS
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --bg-dark: #020204;
      --card-bg: rgba(6, 8, 14, 0.98);
      --card-border: rgba(13, 117, 255, 0.16);
      --primary: #0D75FF;
      --primary-glow: rgba(13, 117, 255, 0.3);
      --cyan: #00F0FF;
      --cyan-glow: rgba(0, 240, 255, 0.25);
      --purple: #8A2BE2;
      --green: #00D97E;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(13, 117, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.04) 0%, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* ─── Top Sticky Header (Mobile Optimized) ─── */
    header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 5, 8, 0.92);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 0.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: #000;
      box-shadow: 0 0 20px var(--cyan-glow);
      flex-shrink: 0;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-info h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.5px;
    }

    .brand-info span {
      font-size: 0.65rem;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .lang-select, .voice-select {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--cyan);
      padding: 0.55rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      text-overflow: ellipsis;
      transition: all 0.25s ease;
    }

    .lang-select {
      border-color: rgba(13, 117, 255, 0.4);
      color: #fff;
      background: rgba(13, 117, 255, 0.12);
    }

    .lang-select:hover, .voice-select:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .lang-select option, .voice-select option {
      background: #0B0E18;
      color: #fff;
    }

    .btn-main-play {
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      color: #000;
      border: none;
      font-weight: 800;
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
      transition: all 0.25s var(--spring-easing);
      white-space: nowrap;
    }

    .btn-main-play:hover {
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.55);
      transform: translateY(-2px);
    }

    .btn-main-play:active {
      transform: scale(0.94);
    }

    /* ─── Main Content Container (Mobile-First) ─── */
    main {
      flex: 1;
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ─── Horizontal Stepper Track (Touch Scroll) ─── */
    .stepper-nav {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .stepper-nav::-webkit-scrollbar {
      display: none;
    }

    .step-pill {
      flex: 0 0 auto;
      background: rgba(14, 18, 28, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 0.65rem 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.25s ease;
    }

    .step-pill:hover {
      background: rgba(13, 117, 255, 0.12);
      border-color: rgba(0, 240, 255, 0.35);
      transform: translateY(-2px);
    }

    .step-pill.active {
      background: linear-gradient(135deg, rgba(13, 117, 255, 0.4), rgba(0, 240, 255, 0.2));
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .pill-idx {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .step-pill.active .pill-idx {
      background: var(--cyan);
      color: #000;
    }

    .pill-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .step-pill.active .pill-title {
      color: #fff;
    }

    /* ─── Presentation Stage Card (Cyber Neon Box) ─── */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(13, 117, 255, 0.1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      position: relative;
    }

    .screen-container {
      position: relative;
      background: #000000;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y pinch-zoom;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .screen-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      will-change: transform, opacity;
    }

    .time-badge {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 800;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
      z-index: 10;
    }

    .swipe-hint {
      position: absolute;
      bottom: 0.85rem;
      right: 0.85rem;
      background: rgba(0, 0, 0, 0.75);
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* ─── Content Info Panel ─── */
    .info-container {
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background: linear-gradient(180deg, rgba(14, 18, 28, 0.5) 0%, rgba(6, 8, 14, 0.98) 100%);
    }

    .info-details-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .info-left-col {
      display: flex;
      flex-direction: column;
    }

    .info-right-col {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.25rem;
    }

    .points-header {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.75rem;
    }

    .info-controls-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .module-tag {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--primary);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .module-tag span {
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
    }

    .slide-headline {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }

    /* ─── Narration Box & Equalizer ─── */
    .narration-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--cyan);
      border-radius: 14px;
      padding: 1rem;
      position: relative;
      margin-bottom: 1.25rem;
    }

    .narration-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .voice-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    .equalizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .eq-bar {
      width: 3px;
      background: var(--cyan);
      border-radius: 2px;
      height: 4px;
      transition: height 0.15s ease;
    }

    .equalizer-bars.active .eq-bar:nth-child(1) { animation: bounceEq 0.5s ease infinite alternate; }
    .equalizer-bars.active .eq-bar:nth-child(2) { animation: bounceEq 0.7s ease infinite alternate 0.15s; }
    .equalizer-bars.active .eq-bar:nth-child(3) { animation: bounceEq 0.4s ease infinite alternate 0.3s; }
    .equalizer-bars.active .eq-bar:nth-child(4) { animation: bounceEq 0.6s ease infinite alternate 0.45s; }

    @keyframes bounceEq {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .narration-body {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #E2E8F0;
      font-weight: 400;
    }

    /* ─── Key Points List ─── */
    .key-points-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .key-point-item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #CBD5E1;
    }

    .key-point-item::before {
      content: "✦";
      color: var(--cyan);
      font-weight: 900;
      font-size: 0.8rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    /* ─── Bottom Navigation & Controls ─── */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn-action-speak {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 0.85rem 1.6rem;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s var(--spring-easing);
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.1);
      white-space: nowrap;
    }

    .btn-action-speak:hover {
      background: rgba(0, 240, 255, 0.18);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
      transform: translateY(-2px);
    }

    .btn-action-speak:active {
      transform: scale(0.95);
    }

    .nav-arrow-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-arrow-step {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 0.85rem 1.6rem;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s var(--spring-easing), background 0.2s;
      white-space: nowrap;
    }

    .btn-arrow-step:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-arrow-step:active:not(:disabled) {
      transform: scale(0.95);
      background: var(--primary);
    }

    .btn-arrow-step:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      transform: none !important;
    }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 16.66%;
      background: linear-gradient(90deg, var(--primary), var(--cyan));
      box-shadow: 0 0 10px var(--cyan);
      transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    footer {
      text-align: center;
      padding: 1.25rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ══════════════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS (TABLET & DESKTOP ENHANCEMENTS)
       ══════════════════════════════════════════════════════════════════ */
    @media (min-width: 768px) {
      header {
        padding: 1.1rem 2rem;
      }
      .brand-info h1 {
        font-size: 1.25rem;
      }
      .lang-select, .voice-select {
        font-size: 0.85rem;
      }
      .btn-main-play {
        font-size: 0.88rem;
        padding: 0.6rem 1.4rem;
      }
      main {
        padding: 1.75rem;
        gap: 1.5rem;
      }
      .slide-headline {
        font-size: 1.85rem;
      }
      .narration-body {
        font-size: 0.98rem;
      }
    }

    @media (min-width: 1024px) {
      header {
        padding: 1.25rem 2.5rem;
      }
      main {
        padding: 2.5rem;
        max-width: 1440px;
      }
      .info-container {
        padding: 2.5rem;
      }
      .info-details-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 2.5rem;
      }
      .info-right-col {
        padding: 1.5rem;
      }
      .slide-headline {
        font-size: 2.1rem;
      }
      .swipe-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- ─── Top Header ─── -->
  <header>
    <div class="brand">
      <div class="brand-badge">⚡</div>
      <div class="brand-info">
        <h1 id="headerTitle">DAIG (Digital A.I. Garage)</h1>
        <span id="headerSubtitle">JAPAN OFFICIAL AI PRESENTATION</span>
      </div>
    </div>

    <div class="header-controls">
      <!-- Language Switcher -->
      <select class="lang-select" id="langSelect" onchange="onLangChange()">
        <option value="ja" selected>🇯🇵 日本語</option>
        <option value="pt">🇧🇷 Português</option>
      </select>

      <!-- Dynamic Voice Selector -->
      <select class="voice-select" id="voiceSelect" onchange="onVoiceChange()">
        <!-- Injected via JS -->
      </select>

      <!-- Play All Button -->
      <button class="btn-main-play" id="playAllBtn" onclick="togglePlayAll()">
        <span id="playIcon">▶</span> <span id="playLabel">全スライド再生</span>
      </button>
    </div>
  </header>

  <!-- ─── Main Cinema Stage (Mobile-First) ─── -->
  <main>
    <!-- Stepper Track -->
    <div class="stepper-nav" id="stepperNav">
      <!-- Injected via JS -->
    </div>

    <!-- Stage Box -->
    <div class="stage-card" id="stageCard">
      <!-- Screen Media -->
      <div class="screen-container">
        <div class="time-badge" id="slideTime">00:00 - 00:45</div>
        <img src="/presentation_frames_clean/frame_001.jpg" alt="DAIG Slide Preview" class="screen-image" id="slideImg">
        <div class="swipe-hint">
          <span>👈</span> <span id="swipeLabel">スワイプで切り替え</span> <span>👉</span>
        </div>
      </div>

      <!-- Info Area -->
      <div class="info-container" id="infoContainer">
        <!-- Details Grid (Left: Title & Narration, Right: Bullets) -->
        <div class="info-details-grid">
          <!-- Left Column -->
          <div class="info-left-col">
            <div class="module-tag" id="slideCat">
              <span>●</span> モジュール 1: AI自動出品
            </div>
            <h2 class="slide-headline" id="slideTitle">
              コンピュータビジョン＆DAIGスマートインターフェース
            </h2>

            <div class="narration-card" id="narrationCard">
              <div class="narration-top">
                <div class="voice-indicator">
                  <span>🎙️</span> <span id="voiceBadgeLabel">AI Neural Studio HD</span>
                </div>
                <div class="equalizer-bars" id="audioEq">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
              </div>
              <p class="narration-body" id="slideNarration">
                読み込み中...
              </p>
            </div>
          </div>

          <!-- Right Column -->
          <div class="info-right-col">
            <div class="points-header" id="pointsHeader">重要ポイント</div>
            <ul class="key-points-list" id="slideBullets">
              <!-- Bullets -->
            </ul>
          </div>
        </div>

        <!-- Controls Area -->
        <div class="info-controls-area">
          <div class="bottom-nav">
            <button class="btn-action-speak" onclick="speakCurrentSlide()">
              <span>🔊</span> <span id="speakBtnLabel">スライド音声</span>
            </button>

            <div class="nav-arrow-group">
              <button class="btn-arrow-step" id="prevBtn" onclick="prevSlide()">◀ 前へ</button>
              <button class="btn-arrow-step" id="nextBtn" onclick="nextSlide()">次へ ▶</button>
            </div>
          </div>

          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footerText">
    DAIG PLATFORM 2026 • JDM AUTOMOTIVE COMPUTER VISION & MULTI-TENANT SAAS ECOSYSTEM
  </footer>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // PRESENTATION DATA (BILINGUAL: JA & PT)
    // ══════════════════════════════════════════════════════════════════
    const slidesData = {
      ja: [
        {
          id: 1,
          time: "00:00 - 00:45",
          category: "モジュール 1: AI自動出品",
          title: "コンピュータビジョン＆DAIGスマートインターフェース",
          img: "/presentation_frames_clean/frame_001.jpg",
          audioMale: "/presentation_audio/slide_ja_1.mp3",
          audioFemale: "/presentation_audio/slide_ja_f_1.mp3",
          narration: "DAIG公式プレゼンテーションへようこそ。DAIGは、日本初となるマルチモーダルAIを搭載した次世代JDM自動車パーツプラットフォームです。出品画面では、高度なコンピュータビジョンアシスタントにより、技術仕様や型番の手動入力を完全にゼロにします。",
          points: [

    const uiStrings = {

        pauseLabel: "一時停止",

        swipeLabel: "スワイプで切り替え",
        voiceOptions: [
          { value: "neural-male", label: "🎙️ 啓太 Keita (Studio HD - 男性)" },
          { value: "neural-female", label: "🎙️ 七海 Nanami (Studio HD - 女性)" },
          { value: "webspeech", label: "🌐 Web Speech (日本語)" }

      pt: {
        headerSubtitle: "Apresentação Oficial & Demonstração",
        playLabel: "Apresentar",
        pauseLabel: "Pausar",
        speakBtn: "Ouvir Slide",
        prevBtn: "◀ Anterior",
        nextBtn: "Próximo ▶",
        pointsHeader: "Pontos Chave",
        voiceBadge: "Locução Neural Studio HD (BR)",
        swipeLabel: "Arraste para navegar",
        voiceOptions: [
          { value: "neural-male", label: "🎙️ Antônio (Studio HD - Masculino)" },
          { value: "neural-female", label: "🎙️ Francisca (Studio HD - Feminino)" },
          { value: "webspeech", label: "🌐 Web Speech (Português)" }
        ]
      }

    let currentLang = 'ja';
    let currentSlide = 0;
    let isPlayingAll = false;
    let synth = window.speechSynthesis;
    let currentAudio = null;
    let voiceMode = 'neural-male';

    function init() {
      updateVoiceOptions();
      buildStepper();
      renderSlide(0, false);
      setupGesturesAndKeys();
    }

    function onLangChange() {
      stopAudio();
      currentLang = document.getElementById('langSelect').value;
      
      const ui = uiStrings[currentLang];
      document.getElementById('headerSubtitle').textContent = ui.headerSubtitle;
      document.getElementById('playLabel').textContent = isPlayingAll ? ui.pauseLabel : ui.playLabel;
      document.getElementById('speakBtnLabel').textContent = ui.speakBtn;
      document.getElementById('prevBtn').textContent = ui.prevBtn;
      document.getElementById('nextBtn').textContent = ui.nextBtn;
      document.getElementById('pointsHeader').textContent = ui.pointsHeader;
      document.getElementById('voiceBadgeLabel').textContent = ui.voiceBadge;
      document.getElementById('swipeLabel').textContent = ui.swipeLabel;

      updateVoiceOptions();
      buildStepper();
      renderSlide(currentSlide, true);
    }

    function updateVoiceOptions() {
      const voiceSelect = document.getElementById('voiceSelect');
      const options = uiStrings[currentLang].voiceOptions;
      voiceSelect.innerHTML = '';
      
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.value;
        el.textContent = opt.label;
        if (opt.value === voiceMode) el.selected = true;
        voiceSelect.appendChild(el);
      });
    }

    function onVoiceChange() {
      voiceMode = document.getElementById('voiceSelect').value;
    }

    function buildStepper() {
      const stepper = document.getElementById('stepperNav');
      stepper.innerHTML = '';
      const currentSlides = slidesData[currentLang];

      currentSlides.forEach((s, idx) => {
        const pill = document.createElement('div');
        pill.className = `step-pill ${idx === currentSlide ? 'active' : ''}`;
        pill.id = `step-pill-${idx}`;
        
        let displayTitle = s.title;
        if (displayTitle.includes('＆')) displayTitle = displayTitle.split('＆')[0].trim();
        else if (displayTitle.includes('&')) displayTitle = displayTitle.split('&')[0].trim();

        pill.innerHTML = `
          <div class="pill-idx">${idx + 1}</div>
          <div class="pill-title">${displayTitle}</div>
        `;
        pill.onclick = () => goToSlide(idx);
        stepper.appendChild(pill);
      });
    }

    function renderSlide(idx, animate = true) {
      currentSlide = idx;
      const currentSlides = slidesData[currentLang];
      const s = currentSlides[idx];

      document.getElementById('slideTime').textContent = s.time;
      document.getElementById('slideImg').src = s.img;
      document.getElementById('slideCat').innerHTML = `<span>●</span> ${s.category}`;
      document.getElementById('slideTitle').textContent = s.title;
      document.getElementById('slideNarration').textContent = s.narration;

      const bulletsList = document.getElementById('slideBullets');
      bulletsList.innerHTML = '';
      s.points.forEach(pt => {
        const li = document.createElement('li');
        li.className = 'key-point-item';
        li.textContent = pt;
        bulletsList.appendChild(li);
      });

      // Update active pill state
      document.querySelectorAll('.step-pill').forEach((pill, i) => {
        pill.classList.toggle('active', i === idx);
        if (i === idx) {
          pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });

      document.getElementById('progressBar').style.width = `${((idx + 1) / currentSlides.length) * 100}%`;
      document.getElementById('prevBtn').disabled = idx === 0;
      document.getElementById('nextBtn').disabled = idx === currentSlides.length - 1;

      // GSAP Animations
      if (animate && window.gsap) {
        gsap.fromTo("#slideImg", 
          { opacity: 0.4, scale: 0.94, filter: 'blur(8px)' }, 
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.55, ease: "power2.out" }
        );

        gsap.fromTo("#slideTitle",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.2)" }
        );

        gsap.fromTo("#narrationCard",
          { opacity: 0, scale: 0.97, y: 10 },
          { opacity: 1, scale: 1, y: 0, duration: 0.45, delay: 0.08, ease: "power2.out" }
        );

        gsap.fromTo(".key-point-item",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.35, stagger: 0.06, delay: 0.16, ease: "power2.out" }
        );
      }
    }

    function goToSlide(idx) {
      if (isPlayingAll) stopAudio();
      renderSlide(idx, true);
    }

    function prevSlide() {
      if (currentSlide > 0) goToSlide(currentSlide - 1);
    }

    function nextSlide() {
      const currentSlides = slidesData[currentLang];
      if (currentSlide < currentSlides.length - 1) goToSlide(currentSlide + 1);
    }

    function setEqActive(active) {
      const eq = document.getElementById('audioEq');
      if (eq) eq.classList.toggle('active', active);
    }

    function speakSlide(idx, onEndCallback) {
      stopAudio();
      setEqActive(true);

      const s = slidesData[currentLang][idx];

      if (voiceMode === 'neural-male' || voiceMode === 'neural-female') {
        const audioSrc = voiceMode === 'neural-male' ? s.audioMale : s.audioFemale;
        currentAudio = new Audio(audioSrc);
        
        currentAudio.onended = () => {
          setEqActive(false);
          if (onEndCallback) onEndCallback();
        };

        currentAudio.onerror = () => {
          speakWebSpeech(s.narration, onEndCallback);
        };

        currentAudio.play().catch(() => {
          speakWebSpeech(s.narration, onEndCallback);
        });
      } else {
        speakWebSpeech(s.narration, onEndCallback);
      }
    }

    function speakWebSpeech(text, onEndCallback) {
      if (!synth) {
        setEqActive(false);
        return;
      }
      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = currentLang === 'ja' ? 'ja-JP' : 'pt-BR';
      utter.rate = 1.0;

      const voices = synth.getVoices();
      if (currentLang === 'ja') {
        const jaVoice = voices.find(v => v.lang.includes('ja-JP') || v.lang.includes('ja_JP') || v.lang.includes('ja'));
        if (jaVoice) utter.voice = jaVoice;
      } else {
        const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR') || v.lang.includes('pt'));
        if (ptVoice) utter.voice = ptVoice;
      }

      utter.onend = () => {
        setEqActive(false);
        if (onEndCallback) onEndCallback();
      };
      utter.onerror = () => setEqActive(false);

      synth.speak(utter);
    }

    function speakCurrentSlide() {
      speakSlide(currentSlide);
    }

    function togglePlayAll() {
      const ui = uiStrings[currentLang];
      if (isPlayingAll) {
        stopAudio();
      } else {
        isPlayingAll = true;
        document.getElementById('playIcon').textContent = '⏸';
        document.getElementById('playLabel').textContent = ui.pauseLabel;
        playSequenceFrom(0);
      }
    }

    function playSequenceFrom(idx) {
      const currentSlides = slidesData[currentLang];
      if (!isPlayingAll || idx >= currentSlides.length) {
        stopAudio();
        return;
      }

      renderSlide(idx, true);
      speakSlide(idx, () => {
        if (isPlayingAll && idx + 1 < currentSlides.length) {
          setTimeout(() => playSequenceFrom(idx + 1), 800);
        } else {
          stopAudio();
        }
      });
    }

    function stopAudio() {
      const ui = uiStrings[currentLang];
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if (synth) synth.cancel();
      setEqActive(false);
      isPlayingAll = false;
      document.getElementById('playIcon').textContent = '▶';
      document.getElementById('playLabel').textContent = ui.playLabel;
    }

    // Touch Swipe & Keyboard Navigation
    function setupGesturesAndKeys() {
      // Keyboard
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextSlide();
        else if (e.key === 'ArrowLeft') prevSlide();
        else if (e.key === ' ') {
          e.preventDefault();
          togglePlayAll();
        }
      });

      // Mobile Touch Gestures (Swipe)
      const container = document.getElementById('stageCard');
      let touchStartX = 0;
      let touchEndX = 0;

      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) nextSlide(); // Swipe left -> next
          else prevSlide(); // Swipe right -> prev
        }
      }, { passive: true });
    }

    window.onload = init;
  </script>
