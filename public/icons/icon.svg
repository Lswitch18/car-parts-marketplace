<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="metal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C8D4E8"/>
      <stop offset="70%" stop-color="#90A0B8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Background (solid black) -->
  <circle cx="50" cy="50" r="49" fill="#000000"/>

  <!-- 8 gear teeth -->
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(0,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(45,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(90,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(135,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(180,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(225,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(270,50,50)"/>
  <rect x="44" y="11" width="12" height="13" rx="2" fill="url(#metal)" transform="rotate(315,50,50)"/>

  <!-- Gear body ring -->
  <circle cx="50" cy="50" r="30" fill="url(#metal)"/>

  <!-- Dark inner circle -->
  <circle cx="50" cy="50" r="22" fill="#000000"/>

  <!-- G letterform -->
  <path d="M 50 29 A 21 21 0 1 0 71 50 L 71 45 L 56 45 L 56 51 L 65 51 A 15 15 0 1 1 50 35 Z" fill="url(#metal)"/>
</svg>