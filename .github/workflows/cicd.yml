name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SUPABASE_PROJECT_REF: clqubcryhbrjlupkgeva
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-ios-simulator:
    name: Build iOS Simulator
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Public Environment Variables
        run: |
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=https://clqubcryhbrjlupkgeva.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_qmK1AvvoZuK_Vgc5ZE26uw_KeLoNOFt
          EOF

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS Simulator App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -derivedDataPath derivedData \
                     build

      - name: Package .app into .zip for Appetize.io
        run: |
          cd ios/App/derivedData/Build/Products/Debug-iphonesimulator
          zip -r $GITHUB_WORKSPACE/ios-simulator-app.zip App.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          retention-days: 7

  deploy-supabase:
    name: Deploy Supabase Functions
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy analyze-part --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-3d --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy parts --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy users --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy transactions --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy auctions --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy categories --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy brands --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy stripe-checkout --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy redis-cache --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy notifications --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy analytics --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy admin --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy logistix-sync --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy logistix-b2b --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy logistics --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy system-metrics --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy ollama-proxy --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy save-to-drive --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy certify-price --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}
          supabase functions deploy parts-lookup --no-verify-jwt --project-ref ${{ env.SUPABASE_PROJECT_REF }}

      - name: Deploy Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -d "supabase/migrations" ]; then
            for migration in supabase/migrations/*.sql; do
              [ -f "$migration" ] || continue
              echo "Deploying migration: $migration"
              supabase db push --project-ref ${{ env.SUPABASE_PROJECT_REF }} --file "$migration" || true
            done
          fi

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: deploy-supabase
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  update-database:
    name: Update Database Schema
    runs-on: ubuntu-latest
    needs: deploy-vercel
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get latest schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          /tmp/supabase links list --project-ref ${{ env.SUPABASE_PROJECT_REF }} || true

      - name: Run database health check
        run: |
          curl -X GET "https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --connect-timeout 10 || echo "Health check completed"

  notification:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-vercel, update-database]
    if: always()
    steps:
      - name: Show deployment status
        run: |
          if [ "${{ needs.deploy-vercel.result }}" == "success" ]; then
            echo "✓ Deploy completed successfully!"
          else
            echo "✗ Deployment failed"
            exit 1
          fi
