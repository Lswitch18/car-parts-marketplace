name: iOS Marketplace Build

on:
  workflow_dispatch:
    inputs:
      app_mode:
        description: 'Vite App Mode (store = Marketplace Puro)'
        required: true
        default: 'store'
        type: choice
        options:
          - store
          - worker
      configuration:
        description: 'Xcode Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS App (.ipa & .xcarchive)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -p
          xcodebuild -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Frontend (Marketplace Store)
        env:
          VITE_APP_MODE: ${{ github.event.inputs.app_mode || 'store' }}
        run: |
          echo "▸ Compilando Web Frontend com VITE_APP_MODE=$VITE_APP_MODE ..."
          npm run build

      - name: Sync Capacitor iOS
        run: |
          echo "▸ Sincronizando assets com Capacitor iOS ..."
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          echo "▸ Instalando CocoaPods ..."
          pod install

      - name: Build & Archive iOS App
        run: |
          mkdir -p build
          echo "▸ Compilando App iOS via xcodebuild ..."
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/DAIG-Marketplace.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa File
        run: |
          echo "▸ Empacotando Payload para .ipa ..."
          mkdir -p build/Payload
          cp -r build/DAIG-Marketplace.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r DAIG-Marketplace.ipa Payload
          ls -lh DAIG-Marketplace.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAIG-Marketplace-iOS-IPA
          path: build/DAIG-Marketplace.ipa
          retention-days: 14

      - name: Upload .xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAIG-Marketplace-xcarchive
          path: build/DAIG-Marketplace.xcarchive
          retention-days: 7
