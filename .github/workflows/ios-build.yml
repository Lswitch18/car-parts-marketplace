name: iOS Marketplace Build

on:
  workflow_dispatch:
    inputs:
      app_mode:
        description: 'Vite App Mode (store = Marketplace Puro)'
        required: true
        default: 'store'
        type: choice
        options:
          - store
          - worker
      configuration:
        description: 'Xcode Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS App (.ipa & .xcarchive)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -p
          xcodebuild -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python (crew monitor)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CrewAI gate — 4 frentes (ios-dev + i18n-qa + security + banco)
        run: |
          echo "▸ CrewAI iOS Apple Team ativa em conjunto (check-only, sem LLM)..."
          python3 scripts/ios_apple_team_crew.py --check-only

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Inject Environment Variables (.env)
        run: |
          echo "▸ Criando arquivo .env para o build do Vite..."
          echo "VITE_APP_MODE=${{ github.event.inputs.app_mode || 'store' }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_STRIPE_PUBLIC_KEY=${{ secrets.VITE_STRIPE_PUBLIC_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || '606997989793-k2cuig6n7v5iiddc2sqfp6acm7st62t9.apps.googleusercontent.com' }}" >> .env
          echo "VITE_GOOGLE_IOS_CLIENT_ID=${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID || '606997989793-6dqib92de1r1v3jsdr0cvs2p9c1md0gm.apps.googleusercontent.com' }}" >> .env
          echo "VITE_SITE_URL=${{ secrets.VITE_SITE_URL || 'https://daig.jp' }}" >> .env
          
      - name: Build Web Frontend (Marketplace Store)
        run: |
          echo "▸ Compilando Web Frontend..."
          npm run build

      - name: Sync Capacitor iOS
        run: |
          echo "▸ Sincronizando assets com Capacitor iOS ..."
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          echo "▸ Instalando CocoaPods ..."
          pod install

      - name: Setup Apple Team (signed release vs unsigned QA)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "▸ Apple Team presente — gerando ExportOptions assinado..."
            APPLE_TEAM_ID="$APPLE_TEAM_ID" ./scripts/ios-apple-team.sh
            ls -lh ios/ExportOptions.generated.plist
          else
            echo "ℹ️ secrets.APPLE_TEAM_ID ausente — archive unsigned p/ QA/Appetize (TestFlight pula esta etapa)."
          fi

      - name: Build & Archive iOS App
        run: |
          mkdir -p build
          echo "▸ Compilando App iOS via xcodebuild ..."
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/DAIG-Marketplace.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export signed .ipa (quando APPLE_TEAM_ID existe)
        if: env.APPLE_TEAM_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -f ios/ExportOptions.generated.plist ]; then
            xcodebuild -exportArchive \
              -archivePath build/DAIG-Marketplace.xcarchive \
              -exportPath build/signed \
              -exportOptionsPlist ios/ExportOptions.generated.plist && ls -lh build/signed || echo "⚠️ export assinado falhou — usando .ipa unsigned p/ QA"
          fi

      - name: Package .ipa File
        run: |
          echo "▸ Empacotando Payload para .ipa ..."
          mkdir -p build/Payload
          cp -r build/DAIG-Marketplace.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r DAIG-Marketplace.ipa Payload
          ls -lh DAIG-Marketplace.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAIG-Marketplace-iOS-IPA
          path: build/DAIG-Marketplace.ipa
          retention-days: 14

      - name: Upload .xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAIG-Marketplace-xcarchive
          path: build/DAIG-Marketplace.xcarchive
          retention-days: 7

      - name: Build for iOS Simulator (Appetize.io)
        run: |
          echo "▸ Compilando App para o Simulador iOS (Appetize) ..."
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Simulator App (.zip)
        run: |
          echo "▸ Empacotando App do simulador ..."
          cd build/simulator/Build/Products/Debug-iphonesimulator
          zip -r App-Simulator.zip App.app
          ls -lh App-Simulator.zip

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAIG-Marketplace-Simulator
          path: build/simulator/Build/Products/Debug-iphonesimulator/App-Simulator.zip
          retention-days: 14
