name: Maestro E2E — Open-Source UI Tests & Gravação de Vídeo (iOS Simulator)

on:
  workflow_dispatch:
    inputs:
      flow_tag:
        description: 'Tag dos flows a executar (smoke, auth, google, apple, i18n, ptbr, all)'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - auth
          - google
          - apple
          - i18n
          - ptbr
          - all
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'ios/**'
      - '.maestro/**'
      - 'package.json'
      - 'capacitor.config.ts'

env:
  NODE_VERSION: '22'
  APP_ID: com.daig.marketplace

jobs:
  maestro-opensource-e2e:
    name: "Maestro CLI Open-Source (Simulador iOS + Vídeo MP4)"
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java 17 (Runtime do Maestro CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🚀 Instalar Maestro CLI (Open Source — 100% Gratuito)
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 📦 Instalar Dependências NPM
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔑 Injetar Variáveis de Ambiente (.env)
        run: |
          echo "VITE_APP_MODE=store"                                              >  .env
          echo "VITE_DEFAULT_LANG=ja"                                            >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"             >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"   >> .env
          echo "VITE_STRIPE_PUBLIC_KEY=${{ secrets.VITE_STRIPE_PUBLIC_KEY }}"   >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || '606997989793-k2cuig6n7v5iiddc2sqfp6acm7st62t9.apps.googleusercontent.com' }}" >> .env
          echo "VITE_GOOGLE_IOS_CLIENT_ID=${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID || '606997989793-6dqib92de1r1v3jsdr0cvs2p9c1md0gm.apps.googleusercontent.com' }}" >> .env
          echo "VITE_SITE_URL=${{ secrets.VITE_SITE_URL || 'https://daig.jp' }}" >> .env

      - name: 🔨 Compilar Web Frontend & Sincronizar Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: 🍏 Selecionar Versão do Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true
          xcodebuild -version

      - name: ⚡ Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-maestro-os-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-maestro-os-
            ${{ runner.os }}-pods-

      - name: 📦 Instalar CocoaPods
        run: cd ios/App && pod install

      - name: 📱 Inicializar Simulador iOS (Nuvem do GitHub)
        run: |
          # Extrai o UUID exato de um iPhone disponível
          DEVICE_UUID=$(xcrun simctl list devices available | grep -i "iPhone 15" | head -1 | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' || true)
          if [ -z "$DEVICE_UUID" ]; then
            DEVICE_UUID=$(xcrun simctl list devices available | grep -i "iPhone" | head -1 | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' || true)
          fi
          echo "UUID do Dispositivo selecionado: $DEVICE_UUID"
          echo "SIMULATOR_DEVICE_ID=$DEVICE_UUID" >> $GITHUB_ENV
          
          # Desliga eventuais instancias e inicializa o simulador
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl boot "$DEVICE_UUID"
          
          # Abre o app Simulator em background para ativar servicos de instalacao e UI
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UUID" 2>/dev/null || true
          
          # Aguarda boot completo do sistema
          xcrun simctl bootstatus "$DEVICE_UUID" -b
          echo "Simulador iOS inicializado com sucesso!"

      - name: 🏗️ Compilar App iOS para Simulador (.app)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_DEVICE_ID" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/simulator" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE="Manual" \
            build

      - name: 📲 Instalar App no Simulador
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/simulator" -name "App.app" -not -path "*/PlugIns/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/build/simulator" -name "*.app" -not -path "*/PlugIns/*" | head -1)
          fi
          echo "App encontrado: $APP_PATH"
          
          # Garante caminho absoluto canonico
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          APP_ABS_PATH="$(cd "$APP_DIR" && pwd)/$APP_NAME"
          echo "Caminho absoluto: $APP_ABS_PATH"
          
          xcrun simctl install "$SIMULATOR_DEVICE_ID" "$APP_ABS_PATH"
          echo "App instalado com sucesso no simulador!"

      - name: 🎥 Iniciar Gravação de Vídeo Nativa (Zero Custo)
        run: |
          mkdir -p artifacts/videos
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_DEVICE_ID" recordVideo --codec=h264 artifacts/videos/maestro-ios-execution.mp4 &
          RECORDER_PID=$!
          echo "RECORDER_PID=$RECORDER_PID" >> $GITHUB_ENV
          echo "Gravação de vídeo em execução em background (PID: $RECORDER_PID)..."

      - name: 🧪 Executar Fluxos do Maestro (Open Source CLI)
        id: maestro_test
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          TAG="${{ github.event.inputs.flow_tag || 'smoke' }}"
          echo "Iniciando testes com tag: $TAG no dispositivo $SIMULATOR_DEVICE_ID"

          if [ "$TAG" = "all" ]; then
            maestro --device "$SIMULATOR_DEVICE_ID" test .maestro/flows/ \
              --format junit \
              --output maestro-report.xml
          else
            maestro --device "$SIMULATOR_DEVICE_ID" test .maestro/flows/ \
              --include-tags "$TAG" \
              --format junit \
              --output maestro-report.xml
          fi

      - name: 🛑 Finalizar Gravação de Vídeo
        if: always()
        run: |
          if [ -n "$RECORDER_PID" ]; then
            echo "Encerrando gravação de vídeo (PID: $RECORDER_PID)..."
            kill -2 "$RECORDER_PID" 2>/dev/null || kill -INT "$RECORDER_PID" 2>/dev/null || true
            sleep 4
            wait "$RECORDER_PID" 2>/dev/null || true
          fi
          ls -lh artifacts/videos/ || echo "Nenhum arquivo de vídeo encontrado"

      - name: 📤 Upload do Vídeo de Execução (MP4)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-video-ios
          path: artifacts/videos/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: 📸 Upload de Screenshots Capturados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-screenshots
          path: |
            screenshots/**/*.png
            .maestro/screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 📄 Upload do Relatório JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-junit-report
          path: maestro-report.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: 📊 Publicar Resumo dos Testes no GitHub Actions
        if: always()
        run: |
          TAG="${{ github.event.inputs.flow_tag || 'smoke' }}"
          STATUS="${{ steps.maestro_test.outcome == 'success' && '✅ APROVADO' || '❌ FALHOU' }}"
          
          echo "## 📱 Maestro E2E — Relatório de Testes Visuais" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resultado** | **$STATUS** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Filtro de Tags** | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Plataforma** | iOS Simulator (Apple Silicon macos-14) |" >> $GITHUB_STEP_SUMMARY
          echo "| **App ID** | \`com.daig.marketplace\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modo** | 100% Open-Source (Sem dependência de serviços pagos) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Evidências Disponíveis para Download" >> $GITHUB_STEP_SUMMARY
          echo "- 🎥 **maestro-video-ios:** Vídeo MP4 completo com toda a navegação e toques na tela." >> $GITHUB_STEP_SUMMARY
          echo "- 📸 **maestro-screenshots:** Screenshots das etapas de teste e verificações de UI." >> $GITHUB_STEP_SUMMARY
          echo "- 📄 **maestro-junit-report:** Arquivo XML com os tempos e status de cada asserção." >> $GITHUB_STEP_SUMMARY
