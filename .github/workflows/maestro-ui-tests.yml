name: Maestro Cloud — UI Tests Visuais (Google + Apple + i18n)

on:
  workflow_dispatch:
    inputs:
      flow_tag:
        description: 'Tag dos flows a executar'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - auth
          - google
          - apple
          - i18n
          - ptbr
      ios_artifact_run:
        description: 'Run ID do workflow ios-build para baixar o .zip do simulador (vazio = builda agora)'
        required: false
        default: ''
  workflow_run:
    workflows: ["iOS Marketplace Build"]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: '22'
  APP_ID: jp.daig.marketplace

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Build simulator .zip OU baixa artifact existente
  # ──────────────────────────────────────────────────────────
  prepare-simulator:
    name: "Preparar .zip do Simulador iOS"
    runs-on: macos-14
    timeout-minutes: 35
    outputs:
      zip_path: ${{ steps.zip.outputs.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Injetar .env (JA padrao + OAuth)
        run: |
          echo "VITE_APP_MODE=store"                                              >  .env
          echo "VITE_DEFAULT_LANG=ja"                                            >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"             >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"   >> .env
          echo "VITE_STRIPE_PUBLIC_KEY=${{ secrets.VITE_STRIPE_PUBLIC_KEY }}"   >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID || '606997989793-k2cuig6n7v5iiddc2sqfp6acm7st62t9.apps.googleusercontent.com' }}" >> .env
          echo "VITE_GOOGLE_IOS_CLIENT_ID=${{ secrets.VITE_GOOGLE_IOS_CLIENT_ID || '606997989793-6dqib92de1r1v3jsdr0cvs2p9c1md0gm.apps.googleusercontent.com' }}" >> .env
          echo "VITE_SITE_URL=${{ secrets.VITE_SITE_URL || 'https://daig.jp' }}" >> .env

      - name: Build web + Sync Capacitor
        run: |
          npm run build
          npx cap sync ios

      - name: Selecionar Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || true
          xcodebuild -version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-maestro-cloud-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-maestro-cloud-
            ${{ runner.os }}-pods-

      - name: Instalar CocoaPods
        run: cd ios/App && pod install

      - name: Build iOS Simulator (.app)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar App.app em .zip (Maestro Cloud)
        id: zip
        run: |
          APP=$(find build/simulator -name "*.app" -not -path "*/PlugIns/*" | head -1)
          echo "App encontrado: $APP"
          mkdir -p maestro-upload
          cp -r "$APP" maestro-upload/App.app
          cd maestro-upload
          zip -r ../daig-simulator.zip App.app
          ls -lh ../daig-simulator.zip
          echo "path=daig-simulator.zip" >> $GITHUB_OUTPUT

      - name: Upload .zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: daig-simulator-maestro
          path: daig-simulator.zip
          retention-days: 3

  # ──────────────────────────────────────────────────────────
  # 2. Maestro Cloud — executa flows visuais
  # ──────────────────────────────────────────────────────────
  maestro-cloud-run:
    name: "Maestro Cloud — UI Tests Visuais"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prepare-simulator

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Baixar .zip do simulador
        uses: actions/download-artifact@v4
        with:
          name: daig-simulator-maestro
          path: ./

      - name: Verificar API Key Maestro Cloud
        run: |
          if [ -z "${{ secrets.MAESTRO_CLOUD_API_KEY }}" ]; then
            echo "AVISO: MAESTRO_CLOUD_API_KEY nao configurado"
            echo "Acesse: https://app.maestro.dev/ para obter sua API Key"
            echo "Adicione como secret: Settings > Secrets > MAESTRO_CLOUD_API_KEY"
            echo ""
            echo "Por enquanto, validando flows localmente (sem subir para cloud)..."
            exit 0
          fi
          echo "MAESTRO_CLOUD_API_KEY configurado!"

      - name: Maestro Cloud — Upload app + Rodar flows visuais
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          TAG="${{ github.event.inputs.flow_tag || 'smoke' }}"

          if [ -z "$MAESTRO_CLOUD_API_KEY" ]; then
            echo "Pulando upload para Maestro Cloud (sem API key)"
            echo "Para ativar: adicione o secret MAESTRO_CLOUD_API_KEY no repositorio"
            exit 0
          fi

          echo "Subindo app para Maestro Cloud..."
          echo "Flows com tag: $TAG"

          maestro cloud \
            --apiKey "$MAESTRO_CLOUD_API_KEY" \
            --app-file daig-simulator.zip \
            --include-tags "$TAG" \
            --format junit \
            --output maestro-cloud-report.xml \
            .maestro/flows/ \
            2>&1 | tee maestro-cloud.log

          echo ""
          echo "Resultado:"
          grep -E "PASSED|FAILED|Dashboard|https://" maestro-cloud.log | tail -10 || true

      - name: Upload relatorio JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-cloud-report
          path: maestro-cloud-report.xml
          retention-days: 14

      - name: Upload log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-cloud-log
          path: maestro-cloud.log
          retention-days: 7

      - name: Instrucoes — Ver resultado visual no dashboard
        if: always()
        run: |
          echo "======================================================"
          echo "  MAESTRO CLOUD — Como ver o resultado visual:"
          echo "======================================================"
          echo ""
          echo "  1. Acesse: https://app.maestro.dev/"
          echo "  2. Faca login com sua conta"
          echo "  3. Abra o projeto DAIG Marketplace"
          echo "  4. Clique no run mais recente para ver:"
          echo "     - Gravacao de video da execucao"
          echo "     - Screenshots de cada step"
          echo "     - Logs detalhados por flow"
          echo "     - Status PASSED / FAILED por flow"
          echo ""
          echo "  Para configurar API Key:"
          echo "  GitHub > Settings > Secrets > New repository secret"
          echo "  Nome: MAESTRO_CLOUD_API_KEY"
          echo "  Valor: (obtido em app.maestro.dev > Account > API Keys)"
          echo "======================================================"
